# This is a basic workflow to help you get started with Actions

name: Doxygen Action

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [review_requested, ready_for_review]

# Abort running jobs if a new one is triggered
concurrency:
  # github.ref = refs/heads/<branch_name> for push or refs/pull/<pr_number>/merge for pull request
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Expected runtime is < 3 minutes
    timeout-minutes: 5
    # How to update container: See ../../test/docker/Readme.md
    container: ghcr.io/hsu-hpc/testmamico

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Doxygen Action
        if: github.event_name == 'push' # Only update documentation when PR was merged
        uses: mattnotmitt/doxygen-action@v1.1.0
        with:
          # Path to Doxyfile
          doxyfile-path: "./Doxyfile" # default is ./Doxyfile
          # Working directory
          working-directory: "." # default is .
      - name: Get coverage
        run: |
          mkdir build
          cd build
          CXX=g++ cmake -DBUILD_WITH_MPI=ON -DCMAKE_BUILD_TYPE=Debug ..
          cmake -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON .
          make -j2 testmamico
          ctest
          make coverage
          mkdir -p ../docs/html
          mv coverage ../docs/html/coverage
      - name: Deploy
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Default Doxyfile build documentation to html directory.
          # Change the directory if changes in Doxyfile
          publish_dir: ./docs/html

      
      # ==========vvv Comment test coverage on corresponding PR vvv==========
      - name: Check Formatting and Test Coverage
        if: github.event_name == 'pull_request'
        run: |
          chown -R $(whoami):$(whoami) .. # Fix issue of reading files in repo
          touch bot-comment.md
          ./test/check_my_formatting.sh >/dev/null 2>> bot-comment.md
          echo "" >> bot-comment.md
          ./test/check_my_coverage.py --skip-make-coverage >> bot-comment.md
          cat bot-comment.md

      - name: Comment Formatting and Test Coverage
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: bot-comment.md
          comment_tag: formatting-and-coverage
          mode: recreate
      # ==========^^^ Comment on corresponding PR ^^^==========
